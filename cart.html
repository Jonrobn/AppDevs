<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Review your CampusWear merchandise selection.">
	<title>CampusWear | Your Cart</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="site-header">
		<div class="container nav-wrap">
			<div id="navigation-content"></div>
		</div>
	</header>

	<section class="announcement" aria-label="Merchandise announcement">
		<div id="announcement-content"></div>
	</section>

	<main>
		<section class="cart-page container" aria-labelledby="cart-title">
			<div id="cart-content"></div>
		</section>
	</main>

	<footer class="site-footer" id="footer">
		<div id="footer-content" class="container"></div>
	</footer>

	<div class="toast" role="status" aria-live="polite"></div>
	<script src="scripts.js"></script>
</body>
</html>
